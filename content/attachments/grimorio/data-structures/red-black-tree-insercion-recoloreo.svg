<svg width="820" height="360" viewBox="0 0 820 360" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .note         { font-size: 12px; fill: #777777; text-anchor: middle; }
    .accent-label { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .accent-arrow-fill { fill: #c0742a; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val    { font-size: 14px; font-weight: 700; fill: #555555; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .note         { fill: #8899aa; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .accent-arrow-fill { fill: #d4884a; }
      .query        { fill: #1e2330; stroke: #d4884a; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .ghost-val    { fill: #aab4c0; }
    }
  </style>

  <!-- antes: padre y tío rojos -->
  <text x="200" y="35" class="op">Caso 1: tío rojo</text>
  <line x1="187.7" y1="93.1" x2="132.3" y2="151.9" class="link"/>
  <line x1="212.3" y1="93.1" x2="267.7" y2="151.9" class="link"/>
  <line x1="112.3" y1="181.3" x2="87.7" y2="233.7" class="link"/>
  <circle cx="200" cy="80" r="18" class="frame"/>
  <text x="200" y="85" class="val-sm">G</text>
  <circle cx="120" cy="165" r="18" class="query"/>
  <text x="120" y="170" class="val-sm">P</text>
  <circle cx="280" cy="165" r="18" class="query"/>
  <text x="280" y="170" class="val-sm">U</text>
  <circle cx="80" cy="250" r="18" class="query"/>
  <text x="80" y="255" class="val-sm">N</text>
  <text x="200" y="298" class="note">N y P son rojos:</text>
  <text x="200" y="314" class="note">se rompe "un rojo no tiene hijo rojo"</text>

  <!-- recoloreo -->
  <path d="M330,180 Q410.0,138 490,174" class="accent-arrow"/>
  <path d="M476.6,174.5 L492.7,175.2 L481.5,163.6 Z" class="accent-arrow-fill"/>
  <text x="410.0" y="100" class="accent-label">recolorear:</text>
  <text x="410.0" y="116" class="accent-label">P y U a negro,</text>
  <text x="410.0" y="132" class="accent-label">G a rojo</text>

  <!-- después -->
  <text x="620" y="35" class="op">Recoloreo</text>
  <line x1="607.7" y1="93.1" x2="552.3" y2="151.9" class="link"/>
  <line x1="632.3" y1="93.1" x2="687.7" y2="151.9" class="link"/>
  <line x1="532.3" y1="181.3" x2="507.7" y2="233.7" class="link"/>
  <circle cx="620" cy="80" r="18" class="query"/>
  <text x="620" y="85" class="val-sm">G</text>
  <circle cx="540" cy="165" r="18" class="frame"/>
  <text x="540" y="170" class="val-sm">P</text>
  <circle cx="700" cy="165" r="18" class="frame"/>
  <text x="700" y="170" class="val-sm">U</text>
  <circle cx="500" cy="250" r="18" class="query"/>
  <text x="500" y="255" class="val-sm">N</text>
  <text x="620" y="298" class="note">la altura negra no cambia,</text>
  <text x="620" y="314" class="note">ahora G puede tener un padre rojo</text>
  <circle cx="24" cy="344" r="9" class="frame"/>
  <text x="40" y="348" class="note" style="text-anchor:start">negro</text>
  <circle cx="102" cy="344" r="9" class="query"/>
  <text x="118" y="348" class="note" style="text-anchor:start">rojo</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
