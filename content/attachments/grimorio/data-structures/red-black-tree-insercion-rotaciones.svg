<svg width="1240" height="450" viewBox="0 0 1240 450" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest">
  <style>
    text { font-family: 'Courier New', Courier, monospace; }
    .frame        { fill: #f5f7fa; stroke: #9baec8; stroke-width: 1.5; }
    .val-sm       { font-size: 15px; font-weight: 700; fill: #1a1a2e; text-anchor: middle; }
    .link         { stroke: #9baec8; stroke-width: 1.8; fill: none; }
    .op           { font-size: 13px; font-weight: 700; fill: #777777; text-anchor: middle; }
    .note         { font-size: 12px; fill: #777777; text-anchor: middle; }
    .accent-label { font-size: 13px; font-weight: 700; fill: #c0742a; text-anchor: middle; }
    .accent-arrow { stroke: #c0742a; stroke-width: 1.8; fill: none; }
    .accent-arrow-fill { fill: #c0742a; }
    .query        { fill: #f5f7fa; stroke: #c0742a; stroke-width: 1.8; }
    .ghost        { fill: #f5f7fa; fill-opacity: 0.5; stroke: #777777; stroke-width: 1.5; stroke-dasharray: 4,3; }
    .ghost-val    { font-size: 14px; font-weight: 700; fill: #555555; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .frame        { fill: #1e2330; stroke: #4a6fa5; }
      .val-sm       { fill: #e2e8f0; }
      .link         { stroke: #4a6fa5; }
      .op           { fill: #8899aa; }
      .note         { fill: #8899aa; }
      .accent-label { fill: #d4884a; }
      .accent-arrow { stroke: #d4884a; }
      .accent-arrow-fill { fill: #d4884a; }
      .query        { fill: #1e2330; stroke: #d4884a; }
      .ghost        { fill: #1e2330; stroke: #8899aa; }
      .ghost-val    { fill: #aab4c0; }
    }
  </style>

  <!-- caso 2: triángulo -->
  <text x="150" y="35" class="op">Caso 2: triángulo (tío negro)</text>
  <line x1="176.9" y1="92.4" x2="113.1" y2="152.6" class="link"/>
  <line x1="203.1" y1="92.4" x2="266.9" y2="152.6" class="link"/>
  <line x1="90.9" y1="180.5" x2="57.6" y2="237.1" class="link"/>
  <line x1="109.1" y1="180.5" x2="140.9" y2="234.5" class="link"/>
  <line x1="143.1" y1="266.6" x2="120.7" y2="321.1" class="link"/>
  <line x1="156.9" y1="266.6" x2="179.3" y2="321.1" class="link"/>
  <circle cx="190" cy="80" r="18" class="frame"/>
  <text x="190" y="85" class="val-sm">G</text>
  <circle cx="100" cy="165" r="18" class="query"/>
  <text x="100" y="170" class="val-sm">P</text>
  <circle cx="280" cy="165" r="18" class="frame"/>
  <text x="280" y="170" class="val-sm">U</text>
  <circle cx="50" cy="250" r="15" class="frame"/>
  <text x="50" y="255" class="val-sm">T1</text>
  <circle cx="150" cy="250" r="18" class="query"/>
  <text x="150" y="255" class="val-sm">N</text>
  <circle cx="115" cy="335" r="15" class="ghost"/>
  <text x="115" y="340" class="ghost-val">T2</text>
  <circle cx="185" cy="335" r="15" class="frame"/>
  <text x="185" y="340" class="val-sm">T3</text>
  <text x="170" y="392" class="note">N es hijo derecho de un</text>
  <text x="170" y="408" class="note">padre que es hijo izquierdo</text>
  <text x="91" y="340" class="accent-label" style="text-anchor:end">pasa a P</text>

  <!-- primera flecha -->
  <path d="M318,205 Q359.0,163 400,199" class="accent-arrow"/>
  <path d="M387.0,195.6 L402.3,201.0 L394.9,186.6 Z" class="accent-arrow-fill"/>
  <text x="359.0" y="118" class="accent-label">rotación</text>
  <text x="359.0" y="134" class="accent-label">izquierda</text>
  <text x="359.0" y="150" class="accent-label">en P</text>

  <!-- caso 3: línea -->
  <text x="560" y="35" class="op">Caso 3: línea (tío negro)</text>
  <line x1="586.9" y1="92.4" x2="523.1" y2="152.6" class="link"/>
  <line x1="613.1" y1="92.4" x2="676.9" y2="152.6" class="link"/>
  <line x1="500.9" y1="180.5" x2="469.1" y2="234.5" class="link"/>
  <line x1="519.1" y1="180.5" x2="552.4" y2="237.1" class="link"/>
  <line x1="453.1" y1="266.6" x2="430.7" y2="321.1" class="link"/>
  <line x1="466.9" y1="266.6" x2="489.3" y2="321.1" class="link"/>
  <circle cx="600" cy="80" r="18" class="frame"/>
  <text x="600" y="85" class="val-sm">G</text>
  <circle cx="510" cy="165" r="18" class="query"/>
  <text x="510" y="170" class="val-sm">N</text>
  <circle cx="690" cy="165" r="18" class="frame"/>
  <text x="690" y="170" class="val-sm">U</text>
  <circle cx="460" cy="250" r="18" class="query"/>
  <text x="460" y="255" class="val-sm">P</text>
  <circle cx="560" cy="250" r="15" class="ghost"/>
  <text x="560" y="255" class="ghost-val">T3</text>
  <circle cx="425" cy="335" r="15" class="frame"/>
  <text x="425" y="340" class="val-sm">T1</text>
  <circle cx="495" cy="335" r="15" class="frame"/>
  <text x="495" y="340" class="val-sm">T2</text>
  <text x="570" y="392" class="note">ahora el padre rojo es N</text>
  <text x="570" y="408" class="note">y el hijo rojo es P</text>
  <text x="584" y="268" class="accent-label" style="text-anchor:start">pasa a G</text>

  <!-- segunda flecha -->
  <path d="M728,205 Q794.0,163 860,199" class="accent-arrow"/>
  <path d="M846.6,198.5 L862.6,200.4 L852.3,188.0 Z" class="accent-arrow-fill"/>
  <text x="794.0" y="118" class="accent-label">N a negro,</text>
  <text x="794.0" y="134" class="accent-label">G a rojo y</text>
  <text x="794.0" y="150" class="accent-label">rotación derecha</text>
  <text x="794.0" y="166" class="accent-label">en G</text>

  <!-- resultado -->
  <text x="1020" y="35" class="op">Resultado</text>
  <line x1="1006.3" y1="91.7" x2="933.7" y2="153.3" class="link"/>
  <line x1="1033.7" y1="91.7" x2="1106.3" y2="153.3" class="link"/>
  <line x1="913.1" y1="181.6" x2="890.7" y2="236.1" class="link"/>
  <line x1="926.9" y1="181.6" x2="949.3" y2="236.1" class="link"/>
  <line x1="1113.1" y1="181.6" x2="1090.7" y2="236.1" class="link"/>
  <line x1="1126.9" y1="181.6" x2="1148.1" y2="233.4" class="link"/>
  <circle cx="1020" cy="80" r="18" class="frame"/>
  <text x="1020" y="85" class="val-sm">N</text>
  <circle cx="920" cy="165" r="18" class="query"/>
  <text x="920" y="170" class="val-sm">P</text>
  <circle cx="1120" cy="165" r="18" class="query"/>
  <text x="1120" y="170" class="val-sm">G</text>
  <circle cx="885" cy="250" r="15" class="frame"/>
  <text x="885" y="255" class="val-sm">T1</text>
  <circle cx="955" cy="250" r="15" class="frame"/>
  <text x="955" y="255" class="val-sm">T2</text>
  <circle cx="1085" cy="250" r="15" class="frame"/>
  <text x="1085" y="255" class="val-sm">T3</text>
  <circle cx="1155" cy="250" r="18" class="frame"/>
  <text x="1155" y="255" class="val-sm">U</text>
  <text x="1020" y="392" class="note">no hay rojo con hijo rojo y la</text>
  <text x="1020" y="408" class="note">raíz del subárbol vuelve a ser negra</text>
  <circle cx="24" cy="436" r="9" class="frame"/>
  <text x="40" y="440" class="note" style="text-anchor:start">negro</text>
  <circle cx="102" cy="436" r="9" class="query"/>
  <text x="118" y="440" class="note" style="text-anchor:start">rojo</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
